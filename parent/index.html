<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>家长学习面板 · German-CY</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#23344a;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}.page{max-width:1040px;margin:auto;padding:24px 16px 80px}h1{margin:0 0 8px;font-size:clamp(1.6rem,4vw,2.4rem)}p{line-height:1.6}.muted{color:#64758d}.panel{background:#fff;border:1px solid #dce4ef;border-radius:15px;padding:18px;margin:15px 0}.login{display:grid;grid-template-columns:1fr 1fr auto;gap:8px}.login input{width:100%;padding:12px;border-radius:8px;border:1px solid #b9c6d6;font:inherit}button{font:inherit;border:0;border-radius:9px;padding:12px 15px;background:#205db7;color:white;cursor:pointer}.secondary{background:#e8eef7;color:#31527f}button[hidden],section[hidden]{display:none}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.metric{background:#eff5fd;border-radius:11px;padding:15px}.metric small{color:#60738e}.metric strong{display:block;font-size:1.8rem;margin-top:5px}table{border-collapse:collapse;width:100%;font-size:.91rem}th,td{text-align:left;padding:9px;border-bottom:1px solid #e7edf4}th{background:#f4f7fa}.chart{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:9px;align-items:end;height:180px;margin-top:15px}.barSlot{text-align:center;font-size:.76rem;display:flex;flex-direction:column;height:100%;justify-content:end;gap:5px}.bar{background:#397ab8;border-radius:6px 6px 2px 2px;min-height:2px}.badges{display:flex;flex-wrap:wrap;gap:8px}.badge{background:#edf1f6;padding:5px 9px;border-radius:9px;font-size:.8rem}.error{color:#b23138}.good{color:#167247}@media(max-width:600px){.login{grid-template-columns:1fr}table{font-size:.8rem}}
</style></head><body><main class="page">
<h1>家长学习面板</h1><p class="muted">查看法语、德语练习情况。只有配置的家长 Firebase 账号可以读取孩子的数据。</p>
<section class="panel" id="authbox"><h2>家长登录</h2><div class="login"><input type="email" id="email" placeholder="家长邮箱" autocomplete="username"><input type="password" id="password" placeholder="密码" autocomplete="current-password"><button id="login">登录</button></div><p id="status" aria-live="polite">等待连接…</p><button class="secondary" id="logout" hidden>退出登录</button></section>
<section id="dashboard" hidden><div class="badges"><span class="badge" id="refreshed">尚未同步</span><button id="refresh">刷新数据</button></div>
<section class="panel"><h2>德语 · Deutsch</h2><div id="de-content">读取中…</div></section>
<section class="panel"><h2>法语 · Français</h2><div id="fr-content">读取中…</div></section>
<p class="muted">统计说明：旧的本地记录迁移后，可显示历史答题数、正确数、打卡和当前错题。按日期的完整答题数与高频错题从启用同步版开始逐步积累。这里只显示答案统计，不含孩子的邮箱。</p>
</section></main><script type="module" src="dashboard.js"></script></body></html>
